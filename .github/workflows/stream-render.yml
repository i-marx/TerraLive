name: stream-render
on:
  push:
    paths:
      - "stream-trigger"
  workflow_dispatch:
    inputs:
      frames:
        description: frames to render (12fps timeline)
        default: "3600"
  schedule:
    - cron: "15 1,7,13,19 * * *"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          npm i --no-audit --no-fund puppeteer@23 2>&1 | tail -1
      - name: render
        run: FRAMES=${{ github.event.inputs.frames || '3600' }} node scripts/render_stream.js
      - name: encode
        run: |
          ffmpeg -y -framerate 12 -i frames/f%05d.jpg -filter_complex "[0:v]scale=1920:1080:flags=lanczos,fps=30,setsar=1,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Earth live wallpaper Terra · on Google Play':fontsize=16:fontcolor=white@0.10:x=w-tw-24:y=h-th-18[v]; aevalsrc='0.055*sin(2*PI*55*t)*(0.75+0.25*sin(2*PI*0.031*t)) + 0.038*sin(2*PI*110.4*t)*(0.75+0.25*sin(2*PI*0.047*t+1.3)) + 0.030*sin(2*PI*164.6*t)*(0.72+0.28*sin(2*PI*0.023*t+2.1)) + 0.024*sin(2*PI*221.2*t)*(0.7+0.3*sin(2*PI*0.037*t+0.7)) + 0.012*sin(2*PI*329.6*t)*(0.65+0.35*sin(2*PI*0.019*t+2.8))':s=44100:d=7200[dr]; anoisesrc=color=brown:r=44100:d=7200:a=0.18[b0]; [b0]lowpass=f=420,volume='0.30+0.16*sin(2*PI*0.013*t)':eval=frame[wa]; [dr][wa]amix=inputs=2:duration=longest:normalize=0,alimiter=limit=0.70[a]" -map "[v]" -map "[a]" -shortest -c:v libx264 -preset veryfast -b:v 6000k -maxrate 6000k -bufsize 12000k -g 60 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart terra_stream_latest.mp4
          ffmpeg -y -ss 45 -i terra_stream_latest.mp4 -frames:v 1 -q:v 2 terra_stream_check.jpg
          ls -la terra_stream_latest.mp4 terra_stream_check.jpg
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create stream --title "Terra stream segments" --notes "Rolling rendered segments for the 24/7 stream. Auto-updated by CI." || true
          gh release upload stream terra_stream_latest.mp4 --clobber
          gh release upload stream terra_stream_check.jpg --clobber